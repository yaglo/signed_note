name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # OpenSSL 3.0, so ML-DSA-44 is unavailable and the library has
          # to refuse it cleanly. This is the common deployment today, and
          # the linters run here because the image is stable.
          - os: ubuntu-24.04
            otp: "29"
            elixir: "1.20.2"
            lint: true

          # OpenSSL 3.5, so every signature type is reachable and the
          # coverage gate means something. The image is in preview, so
          # nothing but coverage depends on it.
          - os: ubuntu-26.04
            otp: "29"
            elixir: "1.20.2"
            cover: true
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ matrix.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      # Reported so the two jobs are visibly testing different builds, and
      # so a silent change of runner image is obvious in the log.
      - name: Report crypto capabilities
        run: |
          openssl version
          mix run --no-start -e '
            IO.puts("ML-DSA-44 available: #{SignedNote.SignatureType.supported?(:mldsa44_cosignature_v1)}")'

      - run: mix test --include go_differential

      # Coverage needs every signature type reachable, so it runs only on
      # the job that has them. Asserting the capability first keeps the
      # gate from silently lapsing if that image ever loses OpenSSL 3.5.
      - if: matrix.cover
        name: Coverage
        run: |
          mix run --no-start -e '
            unless SignedNote.SignatureType.supported?(:mldsa44_cosignature_v1) do
              IO.puts(:stderr, "ML-DSA-44 is unavailable here, so the coverage gate cannot be enforced")
              System.halt(1)
            end'
          mix test --cover

      - if: matrix.lint && startsWith(github.ref, 'refs/tags/v')
        run: SIGNED_NOTE_FUZZ_N=100000 mix test --only go_differential

      - if: matrix.lint
        run: mix format --check-formatted

      - if: matrix.lint
        run: mix credo --strict

      - if: matrix.lint
        run: MIX_ENV=dev mix dialyzer

      - if: matrix.lint
        run: mix docs --warnings-as-errors

      - if: matrix.lint
        run: MIX_ENV=prod mix compile --warnings-as-errors

      - if: matrix.lint
        run: mix hex.build
