name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - otp: "29"
            elixir: "1.20.2"
            lint: true
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

      - run: mix test --include go_differential

      # The coverage gate needs every signature type reachable, and
      # ML-DSA-44 needs OpenSSL 3.5 or later under OTP's crypto. The
      # runner image ships OpenSSL 3.0, so the gate is enforced only where
      # the primitive is present, and says so loudly where it is not.
      - if: matrix.lint
        run: |
          if mix run --no-start -e 'System.halt(if SignedNote.SignatureType.supported?(:mldsa44_cosignature_v1), do: 0, else: 1)'; then
            mix test --cover
          else
            echo "::warning title=Coverage gate not enforced::ML-DSA-44 needs OpenSSL 3.5; this runner has $(openssl version | cut -d' ' -f1-2). The suite ran without those tests."
          fi

      - if: matrix.lint && startsWith(github.ref, 'refs/tags/v')
        run: SIGNED_NOTE_FUZZ_N=100000 mix test --only go_differential

      - if: matrix.lint
        run: mix format --check-formatted

      - if: matrix.lint
        run: mix credo --strict

      - if: matrix.lint
        run: MIX_ENV=dev mix dialyzer

      - if: matrix.lint
        run: mix docs --warnings-as-errors

      - if: matrix.lint
        run: MIX_ENV=prod mix compile --warnings-as-errors

      - if: matrix.lint
        run: mix hex.build
